<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8063c9">
<title>FLOW</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#faf9fc;
  color:#25232a;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
}

button,input{font:inherit}
button{border:0;cursor:pointer}

.app{
  max-width:600px;
  margin:auto;
  padding:20px 18px 90px;
}

header{
  padding:12px 4px 20px;
}

.logo{
  font-size:34px;
  font-weight:800;
  letter-spacing:.08em;
}

.sub{
  margin-top:5px;
  color:#777;
  font-size:14px;
}

.tabs{
  display:flex;
  background:#eeeaf3;
  border-radius:16px;
  padding:4px;
  margin-bottom:18px;
}

.tabs button{
  flex:1;
  padding:12px;
  border-radius:13px;
  background:transparent;
  color:#777;
  font-weight:700;
}

.tabs button.active{
  background:#fff;
  color:#6d4fc2;
  box-shadow:0 2px 8px #00000010;
}

.card{
  background:#fff;
  border-radius:22px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 3px 15px #00000008;
}

h2{
  font-size:21px;
  margin:0 0 5px;
}

.desc{
  font-size:13px;
  color:#888;
  margin-bottom:15px;
}

.task{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 4px;
  border-bottom:1px solid #eee;
}

.task:last-child{
  border-bottom:0;
}

.check{
  width:27px;
  height:27px;
  border:2px solid #c9c3d3;
  border-radius:50%;
  background:white;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
}

.check.done{
  background:#8063c9;
  border-color:#8063c9;
  color:white;
}

.taskname{
  flex:1;
  font-weight:600;
}

.task.done .taskname{
  text-decoration:line-through;
  color:#aaa;
}

.small{
  font-size:12px;
  color:#999;
}

.btn{
  width:100%;
  padding:13px;
  border-radius:14px;
  background:#8063c9;
  color:white;
  font-weight:700;
  margin-top:10px;
}

.btn.light{
  background:#f0edf5;
  color:#6044a0;
}

.btn.gray{
  background:#eee;
  color:#555;
}

.row{
  display:flex;
  gap:8px;
}

.row>*{
  flex:1;
}

.progress{
  height:9px;
  background:#eee;
  border-radius:10px;
  overflow:hidden;
  margin:14px 0;
}

.progressbar{
  height:100%;
  background:#8063c9;
  width:0%;
  transition:.3s;
}

.message{
  text-align:center;
  font-weight:700;
  padding:8px;
}

.input{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:12px;
  background:#fff;
}

.routineStep{
  display:flex;
  gap:12px;
  align-items:center;
  padding:15px 5px;
  border-bottom:1px solid #eee;
}

.num{
  width:30px;
  height:30px;
  border-radius:50%;
  background:#eeeaf3;
  color:#6547a7;
  display:grid;
  place-items:center;
  font-weight:800;
}

.routineStep.current{
  background:#f5f0ff;
  border-radius:15px;
  padding:15px;
}

.timer{
  text-align:center;
  font-size:52px;
  font-weight:800;
  margin:15px 0;
}

.badge{
  display:inline-block;
  background:#eeeaf3;
  color:#6749a8;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
}

.hidden{
  display:none !important;
}

.notice{
  background:#fff5dd;
  padding:14px;
  border-radius:15px;
  color:#72571d;
  margin-top:12px;
}

.modal{
  position:fixed;
  inset:0;
  background:#0007;
  display:flex;
  align-items:flex-end;
  z-index:10;
}

.modalbox{
  background:white;
  width:100%;
  max-width:600px;
  margin:auto 0 0;
  padding:22px;
  border-radius:25px 25px 0 0;
}

.modalbox h3{
  margin-top:0;
}

.choice{
  padding:15px;
  border:2px solid #eee;
  border-radius:15px;
  margin:8px 0;
  text-align:left;
  background:white;
}

.choice:hover{
  border-color:#8063c9;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">FLOW</div>
  <div class="sub">毎日の生活を、無理なく流れにのせる</div>
</header>

<div class="tabs">
  <button id="minTab" class="active" onclick="showMode('minimum')">
    🌱 最低限モード
  </button>

  <button id="runTab" onclick="showMode('routine')">
    ⏱️ ルーティンモード
  </button>
</div>

<!-- 最低限モード -->
<section id="minimum">

<div class="card">

<h2>今日の最低限</h2>

<div class="desc">
順番は自由。できたものからチェックしよう。
</div>

<div id="tasks"></div>

<div class="progress">
  <div id="minProgress" class="progressbar"></div>
</div>

<div id="minMessage" class="message">
今日はここから。
</div>

<div class="row">
<button class="btn" onclick="addTask()">
＋ やることを追加
</button>

<button class="btn light" onclick="zeroMode()">
🌱 やる気ゼロ
</button>
</div>

<button class="btn gray" onclick="resetTasks()">
今日をリセット
</button>

</div>

<div class="card">

<h2>あとでやる</h2>

<div class="desc">
今じゃなくても大丈夫。あとで戻そう。
</div>

<div id="later"></div>

</div>

</section>


<!-- ルーティンモード -->
<section id="routine" class="hidden">

<div class="card">

<h2>ルーティン</h2>

<div class="desc">
決めた順番で、時間内に流れよう。
</div>

<label class="small">出発時刻</label>

<input
  id="leaveTime"
  class="input"
  type="time"
  onchange="checkRush()"
>

<div id="routineInfo" class="notice">
通常モード：必要時間 約28分
</div>

<div id="routineSteps"></div>

<button class="btn" onclick="startTimer()">
▶ スタート
</button>

<button class="btn light" onclick="nextStep()">
次へ →
</button>

</div>


<div class="card">

<h2>タイマー</h2>

<div id="timerName" class="message">
準備できたらスタート
</div>

<div id="timer" class="timer">
00:00
</div>

<div class="row">

<button class="btn light" onclick="pauseTimer()">
一時停止
</button>

<button class="btn gray" onclick="resetTimer()">
リセット
</button>

</div>

</div>

</section>

</div>


<!-- 急ぎモーダル -->
<div id="rushModal" class="modal hidden">

<div class="modalbox">

<h3>🏃 時間が足りないかも</h3>

<p>
通常ルーティンのままだと、
出発時刻までに終わらない可能性があります。
</p>

<button class="choice" onclick="setRush(true)">
🏃 急ぎモードにする
</button>

<button class="choice" onclick="setRush(false)">
🧘 通常モードのまま
</button>

</div>

</div>


<script>

const defaultTasks = [
  {name:"英単語",done:false},
  {name:"英文法",done:false},
  {name:"運動",done:false},
  {name:"水分をとる",done:false},
  {name:"明日の準備",done:false}
];

const defaultRoutine = [
  {name:"着替える",normal:5,rush:3},
  {name:"朝ごはん",normal:10,rush:7},
  {name:"歯みがき・洗顔",normal:8,rush:5},
  {name:"荷物確認",normal:5,rush:3}
];

let tasks =
  JSON.parse(localStorage.getItem("flowTasks")) ||
  defaultTasks.map(t=>({...t}));

let later =
  JSON.parse(localStorage.getItem("flowLater")) ||
  [];

let routine =
  JSON.parse(localStorage.getItem("flowRoutine")) ||
  defaultRoutine;

let rush = false;
let currentStep = 0;
let timerId = null;
let remaining = 0;


function save(){

  localStorage.setItem(
    "flowTasks",
    JSON.stringify(tasks)
  );

  localStorage.setItem(
    "flowLater",
    JSON.stringify(later)
  );
}


function escapeHtml(text){

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}


function showMode(mode){

  document
    .getElementById("minimum")
    .classList.toggle("hidden",mode !== "minimum");

  document
    .getElementById("routine")
    .classList.toggle("hidden",mode !== "routine");

  document
    .getElementById("minTab")
    .classList.toggle("active",mode === "minimum");

  document
    .getElementById("runTab")
    .classList.toggle("active",mode === "routine");

  if(mode === "routine"){
    renderRoutine();
  }
}


function renderTasks(){

  const box = document.getElementById("tasks");

  box.innerHTML = "";

  tasks.forEach((task,index)=>{

    const div = document.createElement("div");

    div.className =
      "task " + (task.done ? "done" : "");

    div.innerHTML = `

      <button
        class="check ${task.done ? "done" : ""}"
        onclick="toggleTask(${index})"
      >
        ${task.done ? "✓" : ""}
      </button>

      <div class="taskname">
        ${escapeHtml(task.name)}
      </div>

      <button
        class="small"
        onclick="postpone(${index})"
      >
        あとで
      </button>
    `;

    box.appendChild(div);

  });

  updateProgress();
  renderLater();
}


function toggleTask(index){

  tasks[index].done =
    !tasks[index].done;

  save();
  renderTasks();
}


function updateProgress(){

  const total = tasks.length;

  const done =
    tasks.filter(t=>t.done).length;

  const percent =
    total
    ? Math.round(done / total * 100)
    : 0;

  document
    .getElementById("minProgress")
    .style.width = percent + "%";

  let message = "今日はここから。";

  if(percent === 100){
    message = "全部できた！🌸";
  }
  else if(percent >= 80){
    message = "最低限クリア！✨";
  }
  else if(percent >= 50){
    message = "頑張った！！";
  }
  else if(percent > 0){
    message = "今日はここまで！";
  }

  document
    .getElementById("minMessage")
    .textContent = message;
}


function addTask(){

  const name =
    prompt("追加することを入力してね");

  if(name && name.trim()){

    tasks.push({
      name:name.trim(),
      done:false
    });

    save();
    renderTasks();
  }
}


function postpone(index){

  later.push(tasks[index].name);

  tasks.splice(index,1);

  save();
  renderTasks();
}


function renderLater(){

  const box =
    document.getElementById("later");

  if(!later.length){

    box.innerHTML =
      '<div class="small">まだありません。</div>';

    return;
  }

  box.innerHTML = "";

  later.forEach((name,index)=>{

    const div =
      document.createElement("div");

    div.className = "task";

    div.innerHTML = `

      <div class="taskname">
        ${escapeHtml(name)}
      </div>

      <button
        class="small"
        onclick="restoreLater(${index})"
      >
        戻す
      </button>
    `;

    box.appendChild(div);

  });
}


function restoreLater(index){

  tasks.push({
    name:later[index],
    done:false
  });

  later.splice(index,1);

  save();
  renderTasks();
}


function zeroMode(){

  alert("今日は「ちょっとだけ」でOK🌱");
}


function resetTasks(){

  if(confirm("今日のチェックをリセットする？")){

    tasks =
      defaultTasks.map(t=>({...t}));

    later = [];

    save();
    renderTasks();
  }
}


function renderRoutine(){

  const box =
    document.getElementById("routineSteps");

  box.innerHTML = "";

  routine.forEach((step,index)=>{

    const mins =
      rush ? step.rush : step.normal;

    const div =
      document.createElement("div");

    div.className =
      "routineStep " +
      (index === currentStep ? "current" : "");

    div.innerHTML = `

      <div class="num">
        ${index + 1}
      </div>

      <div style="flex:1">

        <div style="font-weight:700">
          ${escapeHtml(step.name)}
        </div>

        <div class="small">
          ${mins}分
          ${rush ? "・短縮" : ""}
        </div>

      </div>
    `;

    box.appendChild(div);

  });

  updateRoutineInfo();
}


function totalMinutes(){

  return routine.reduce(
    (total,step)=>
      total + (rush ? step.rush : step.normal),
    0
  );
}


function updateRoutineInfo(){

  const mins =
    totalMinutes();

  document
    .getElementById("routineInfo")
    .textContent =
      (rush
        ? "🏃 急ぎモード："
        : "通常モード：")
      + "必要時間 約"
      + mins
      + "分";
}


function checkRush(){

  const value =
    document.getElementById("leaveTime").value;

  if(!value)return;

  const now = new Date();

  const [hour,minute] =
    value.split(":").map(Number);

  const leave = new Date();

  leave.setHours(
    hour,
    minute,
    0,
    0
  );

  let diff =
    Math.round(
      (leave-now)/60000
    );

  if(
    diff > 0 &&
    totalMinutes() > diff &&
    !rush
  ){

    document
      .getElementById("rushModal")
      .classList.remove("hidden");
  }
}


function setRush(value){

  rush = value;

  document
    .getElementById("rushModal")
    .classList.add("hidden");

  renderRoutine();
}


function startTimer(){

  if(timerId)return;

  if(currentStep >= routine.length){

    currentStep = 0;
  }

  const step =
    routine[currentStep];

  remaining =
    (rush ? step.rush : step.normal) * 60;

  document
    .getElementById("timerName")
    .textContent =
      step.name;

  renderTimer();

  timerId =
    setInterval(()=>{

      remaining--;

      renderTimer();

      if(remaining <= 0){

        clearInterval(timerId);

        timerId = null;

        alert(
          "「" +
          routine[currentStep].name +
          "」完了！"
        );

        nextStep();
      }

    },1000);
}


function renderTimer(){

  const minutes =
    Math.floor(remaining/60);

  const seconds =
    remaining % 60;

  document
    .getElementById("timer")
    .textContent =
      String(minutes).padStart(2,"0")
      + ":"
      + String(seconds).padStart(2,"0");
}


function pauseTimer(){

  if(timerId){

    clearInterval(timerId);

    timerId = null;
  }
}


function resetTimer(){

  pauseTimer();

  remaining = 0;

  document
    .getElementById("timer")
    .textContent = "00:00";
}


function nextStep(){

  pauseTimer();

  currentStep++;

  if(currentStep >= routine.length){

    currentStep = 0;

    document
      .getElementById("timerName")
      .textContent =
        "ルーティン完了！🎉";

  }

  renderRoutine();
}


renderTasks();
renderRoutine();

</script>

</body>
</html>
